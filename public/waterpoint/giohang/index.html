<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Giỏ hàng | Waterpoint | ERA Vietnam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BUOC 3 "GIO HANG" - dung chung token + kieu nut .k3d voi 2 tab kia.

   12/09: Anh Tony chot lam GOC NHIN thoi, phan gim lo lam sau. Trang chi
          co dung mot thu. KHONG tu them nut/bang (da bi nhac vi bo box).
   17/09: Anh Tony YEU CAU them phan gim lo + doi lop:
          "khi khach click vao xem can o hinh 2d, sau khi khach chon, muon
           xem thuc te thi se bam nut, va se duoc hien thi can tren thuc te
           tai flycam"
          => 3 thu moi, DEU LA VIEC ANH GIAO, khong phai Em tu them:
             1. lop BAN VE 2D (canh `pk_park_village_ve`) + nut doi lop
             2. 96 khung lo bam duoc
             3. hop thong tin mot lo, doc tu Google Sheet bang MA CAN
          Luat cu van con hieu luc: ngoai 3 thu tren, dung tu them gi nua.
   24/09: Anh Tony giao "2 file gio hang doc quyen ERA ... lam vao 360 gio
          hang" + "xoa tat ca data gio hang cu". Anh chot 4 y:
             · CHI CAN ERA SANG (19 PV + 48 Aqua), lo khac mo + khong bam duoc
             · Aqua chi ve khung 48 can ERA (Anh tu cham bang cong cu)
             · du lieu tu Google Sheet MOI, moi phan khu mot the
             · cong khai duoc
          => Aqua co them LOP BAN VE (`pk_aqua_ve`) giong PV.
   ============================================================ */
:root{
  --wp-primary:#003C4B; --wp-primary-hover:#006D88; --wp-primary-tint:#7FD3E3;
  --wp-canvas:#000000; --wp-hairline:#005A70; --wp-on-primary:#FFFFFF;
  --wp-text:#FFFFFF; --wp-text-soft:rgba(255,255,255,.9);
  --wp-text-muted:rgba(255,255,255,.6); --wp-text-disabled:rgba(255,255,255,.3);
  --wp-surface-360:#0A1214;
  --wp-overlay-nav:rgba(0,60,75,.9); --wp-overlay-soft:rgba(0,60,75,.3);
  --wp-font:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --wp-fw-thin:100; --wp-fw-regular:400; --wp-fw-bold:700;
  --wp-fs-body:16px; --wp-fs-label:12px;
  --wp-space-xxs:4px; --wp-space-xs:8px; --wp-space-sm:12px;
  --wp-space-md:16px; --wp-space-lg:24px; --wp-space-xl:32px;
  --wp-control-h:40px; --wp-control-h-lg:48px; --wp-nav-h:52px;
  --wp-z-overlay:50; --wp-z-toast:999999999;
  --wp-vang:#E0B14A; --wp-canh-teal:#00232C;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--wp-canvas);
  font-family:var(--wp-font);color:var(--wp-text);-webkit-tap-highlight-color:transparent}
#pano{position:fixed;inset:0;background:var(--wp-surface-360)}
/* 29/09 NHAN MA CAN NOI - chu HTML dat len tam can, LUON DUNG THANG (ban ve Aqua bi xoay
   ~179 do nen ma in san tren ban ve lon nguoc). pointer-events:none -> bam xuyen xuong khung lo.
   Co chu theo zoom: --tl = 60/fov do JS dat (0.6 zoom ra het .. 1.6 zoom sat) - hoc PGBL.
   🆕 29/09 KIEU "BANG CO COT" (Anh Tony: "zoom vao thi chu che luon layout"): goc toa do la
   CHAM o chan cot = tam can; bang chu nam TREN dau cot => zoom vao chu khong de len nha.
   transform-origin o chan cot -> co theo zoom ma cham van dung tam can. */
#lop-ma{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden;--tl:1}
#lop-ma .ma{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;
  transform:translate(-50%,-100%) scale(var(--tl));transform-origin:50% 100%;transition:opacity .2s}
#lop-ma .ma b{padding:2px 7px;border-radius:0 7px 0 7px;background:rgba(0,35,44,.88);color:#fff;
  font-size:15px;font-weight:var(--wp-fw-bold);letter-spacing:.02em;line-height:1.35;white-space:nowrap;
  box-shadow:0 1px 5px rgba(0,0,0,.45)}
/* --cot = chieu cao cot, JS `xepTang()` dat theo tang (24, 50, 76... px) de bang cac can sat nhau khong de nhau */
#lop-ma .ma i{display:block;width:2px;height:var(--cot,24px);background:#fff;box-shadow:0 0 2px rgba(0,0,0,.7);
  transition:height .15s}
#lop-ma .ma i::after{content:"";display:block;width:8px;height:8px;margin:calc(var(--cot,24px) - 4px) 0 0 -3px;border-radius:50%;
  transition:margin .15s;
  background:#fff;box-shadow:0 0 0 2px rgba(0,35,44,.9)}
#lop-ma .ma.mo{opacity:.4}
#lop-ma .ma.chon{opacity:1;z-index:1}
#lop-ma .ma.chon b{background:var(--wp-vang);color:#00232C}
#lop-ma .ma.chon i,#lop-ma .ma.chon i::after{background:var(--wp-vang)}
button{font-family:var(--wp-font);cursor:pointer;border:0}

/* ===== NUT THEO FILE Group.svg Anh Tony gui 12/09 - DO THANG TU PATH =====
   BO 2 GOC DOI NHAU (tren-phai · duoi-trai), ban kinh = 34% chieu cao.
   Hai goc con lai VUONG. KHONG he co vat cheo.
   🔴 Co file SVG thi DOC PATH, dung doan tu anh chup (da sai 4 lan).
   ========================================================================= */
.k3d{
  --r:18px; --nen:var(--wp-primary);
  border-radius:0 var(--r) 0 var(--r);
  background:var(--nen);
  color:var(--wp-text);
  box-shadow:3px 3px 14px rgba(0,0,0,.26);
  transition:background .15s, box-shadow .15s, transform .08s;
}
.k3d:hover{--nen:var(--wp-primary-hover);background:var(--nen)}
.k3d:active,.k3d.nhan-xuong{transform:translateY(2px);
  box-shadow:1px 1px 6px rgba(0,0,0,.30)}
/* nut khong dung duoc: doi MAU NEN dac, KHONG dung opacity */
.k3d:disabled{--nen:#0A2A34;background:var(--nen);color:rgba(255,255,255,.38);
  box-shadow:2px 2px 10px rgba(0,0,0,.22);cursor:not-allowed}
.k3d:disabled:hover{--nen:#0A2A34;background:var(--nen)}
.k3d:disabled:active{transform:none}

/* Ban kinh = 34% chieu cao, tinh rieng tung co */
.tab{--r:18px}     /* cao 52px */
#brand{--r:18px}

/* ---- Brand ---- */
#brand{position:fixed;top:var(--wp-space-md);left:var(--wp-space-md);z-index:var(--wp-z-overlay);
  min-height:var(--wp-nav-h);display:flex;align-items:center;gap:var(--wp-space-sm);
  padding:var(--wp-space-xs) var(--wp-space-md);cursor:default}
#brand:hover{--nen:var(--wp-primary)}
#brand:active{transform:none}
#brand img{height:28px;width:auto;display:block}
#brand .ten{font-size:var(--wp-fs-body);color:var(--wp-text);letter-spacing:.5px;line-height:1.15}
#brand .phu{font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);
  letter-spacing:1px;text-transform:uppercase;color:var(--wp-primary-tint);line-height:1.3}

/* ---- Thanh 3 buoc ---- */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--wp-space-xl);
  z-index:var(--wp-z-overlay);display:flex;align-items:flex-start;gap:var(--wp-space-xs);
  max-width:calc(100vw - var(--wp-space-xl));overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
#nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;height:var(--wp-nav-h);padding:0 var(--wp-space-lg);
  font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);letter-spacing:1.1px;
  text-transform:uppercase;white-space:nowrap}
.tab.on{--nen:var(--wp-primary-hover)}

#tai{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;
  font-size:var(--wp-fs-label);letter-spacing:1px;color:var(--wp-text-muted);
  max-width:calc(100vw - var(--wp-space-xl));text-align:center;line-height:1.6}

/* ---- Dai chip chon canh con (16/09) ----
   🔴 CHEP Y CONG THUC cua `#ds` ben trang Thuc te, KHONG tu nghi ra so moi.
   `--ds-chua` = be ngang phai chua trong o mep PHAI cho qua cau dieu huong;
   mac dinh 0, `era-globe.js` dat lai con so theo tung kho man - va file do
   DA duoc nap san o trang nay (dong script cuoi body). Chua mot ben nen
   TRU MOT LAN roi DOI TAM sang trai NUA khoang do, khong tru ca hai ben
   (do that ben kia: iPhone doc mat oan 84px).
   ⚠️ `bottom` phai dung y cong thuc nay - quả cầu, thanh zoom va thanh buoc
   deu neo theo no. Doi la xo lech het.
   ⚠️ KHONG chep lop mui ten `#ds-dh`/`#ds-dem` sang day: lop do sinh ra cho
   dai 5 canh bi tran tren dien thoai. O day chi 2 chip, khong bao gio tran. */
#ds{position:fixed;left:calc(50% - var(--ds-chua,0px) / 2);
  transform:translateX(-50%);
  bottom:calc(var(--wp-space-xl) + var(--wp-nav-bar-h,var(--wp-nav-h)) + var(--wp-space-sm));
  max-width:calc(100vw - var(--wp-space-xl) - var(--ds-chua,0px));
  z-index:var(--wp-z-overlay);display:flex;align-items:flex-start;
  gap:var(--wp-space-xs);overflow-x:auto;scrollbar-width:none;
  padding:0 var(--wp-space-xxs) 6px}
#ds::-webkit-scrollbar{display:none}
/* 01/10 menu con: ngay TREN dai chip, cung cong thuc can giua; nut nen trang de khac dai chip phan khu */
#ds-con{position:fixed;left:calc(50% - var(--ds-chua,0px) / 2);transform:translateX(-50%);
  bottom:calc(var(--wp-space-xl) + var(--wp-nav-bar-h,var(--wp-nav-h)) + var(--wp-space-sm) + var(--wp-control-h) + 14px);
  z-index:var(--wp-z-overlay);display:flex;gap:6px;padding:0 var(--wp-space-xxs)}
/* 01/10 (2) Anh Tony: "cum menu nho 1 chut, khoang cach do cao giua 2 menu giam" => nut con 32px.
   01/10 (3) "dang sat voi nhau qua" => +14px (khe nhin thay ~8px; +6px la dinh lien) */
#ds-con .o.con{height:32px;padding:0 var(--wp-space-sm);font-size:11px;--r:12px}
#ds-con[hidden]{display:none}
#ds-con .o.con{--nen:#FFFFFF;color:var(--wp-primary)}
#ds-con .o.con.on{--nen:var(--wp-vang);color:var(--wp-primary)}
.o{flex:0 0 auto;height:var(--wp-control-h);padding:0 var(--wp-space-md);
  font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);letter-spacing:1px;
  text-transform:uppercase;white-space:nowrap}
.o.on{--nen:var(--wp-vang);color:var(--wp-primary)}   /* 01/10 Anh Tony: nut da bam doi xanh nhat -> VANG */

/* 🔴 Do that 12/09: dien thoai XOAY NGANG chi cao ~390px -
   phai co CA max-width LAN max-height, `max-width` khong bat duoc ca nay. */
@media (max-height:600px){
  #nav{bottom:var(--wp-space-sm)}
  /* Chip phai tut theo thanh buoc, chep y cong thuc trang Tong quan.
     ⚠️ Khoi nay hien KHONG an thua vi `era-buoc.js` nap sau nen ghi de
     `#nav{bottom}`. Van giu lai: file do quang cao la ADDITIVE, go 1 dong
     <script> la tra ve nhu cu - luc do khoi nay phai con dung. */
  #ds{bottom:calc(var(--wp-space-sm) + var(--wp-nav-bar-h,var(--wp-nav-h)) + var(--wp-space-xxs))}
  #ds-con{bottom:calc(var(--wp-space-sm) + var(--wp-nav-bar-h,var(--wp-nav-h)) + var(--wp-space-xxs) + var(--wp-control-h) + 14px)}
  .tab{height:44px;padding:0 var(--wp-space-md)}
  #brand{padding:var(--wp-space-xxs) var(--wp-space-sm);min-height:40px}
}
@media (max-width:568px){
  .tab{padding:0 var(--wp-space-sm);letter-spacing:.6px}
  .o{padding:0 var(--wp-space-sm);letter-spacing:.6px}
}

/* ============================================================
   LOP BAN VE <-> ANH THUC TE  +  HOP THONG TIN LO   (17/09/2026)

   Anh Tony chot: khach xem BAN VE 2D truoc, bam vao can minh thich,
   roi bam nut de thay chinh can do TREN ANH FLYCAM THAT.
   => Mac dinh vao la lop BAN VE. Nut doi lop nam ngay duoi hop thong tin
      (dung cho tay dang o do) VA co mot nut noi o goc phai tren cho nguoi
      chua chon can nao.
   ⚠️ CO Y KHONG lam chu giai mau: cot "Trang thai" trong Sheet dang de
      trong (Anh Tony chot 17/09 "de trong da, map bang ma can") nen 96 khung
      deu trang - bay chu giai ra cung khong noi len dieu gi. Khi nao Sheet
      co trang thai that thi `veLo()` tu to mau, luc do moi them chu giai.
   ============================================================ */
/* 🔴 NUT DAT O GOC TRAI DUOI - da do het 4 goc, chi con goc nay trong:
     · trai tren  = `#brand` (va `#lo-card` ngay duoi no)
     · phai tren  = la ban `#eraLaBan` (era-laban.js neo cung right/top 16px,
                    KHONG doc bien CSS nao nen khong day di duoc)
     · phai duoi  = qua cau dieu huong + thanh zoom (era-globe.js)
     · giua duoi  = dai chip `#ds` + thanh 3 buoc `#nav` */
#nut-lop{position:fixed;left:var(--wp-space-md);bottom:var(--wp-space-xl);
  z-index:calc(var(--wp-z-overlay) + 2);height:var(--wp-control-h-lg);
  padding:0 var(--wp-space-lg);font-size:var(--wp-fs-label);
  font-weight:var(--wp-fw-bold);letter-spacing:1px;text-transform:uppercase;
  white-space:nowrap;--r:16px}
/* 25/09 Anh Tony: "lam cho cai nay noi bat, mau vang hoac trang, dung bo mau co san" => nen --wp-vang */
#nut-lop{--nen:var(--wp-vang);color:var(--wp-canh-teal);box-shadow:0 4px 14px rgba(0,0,0,.45)}
#nut-lop:hover{--nen:#FFFFFF;color:var(--wp-canh-teal)}
#nut-lop[hidden]{display:none}

#lo-card{position:fixed;left:var(--wp-space-md);
  top:calc(var(--wp-space-md) + var(--wp-nav-h) + var(--wp-space-sm));
  z-index:calc(var(--wp-z-overlay) + 1);width:290px;max-width:calc(100vw - var(--wp-space-xl));
  max-height:calc(100vh - 220px);overflow-y:auto;
  background:var(--wp-overlay-nav);backdrop-filter:blur(6px);
  border-radius:0 18px 0 18px;box-shadow:3px 3px 18px rgba(0,0,0,.34);
  padding:var(--wp-space-md)}
#lo-card[hidden]{display:none}
#lo-card .dong-dau{display:flex;align-items:flex-start;gap:var(--wp-space-xs)}
#lo-card .ma{font-size:30px;font-weight:var(--wp-fw-bold);line-height:1;letter-spacing:1px}
#lo-card .dong-dau button{margin-left:auto;background:transparent;color:var(--wp-text-muted);
  font-size:22px;line-height:1;padding:2px 4px}
#lo-card .dong-dau button:hover{color:var(--wp-text)}
#lo-card .loai{margin-top:6px;font-size:var(--wp-fs-label);letter-spacing:1px;
  text-transform:uppercase;color:var(--wp-primary-tint);font-weight:var(--wp-fw-bold)}
#lo-card .chip{display:inline-block;margin-top:var(--wp-space-sm);padding:5px 12px;
  border-radius:999px;font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);
  letter-spacing:.8px;text-transform:uppercase;color:#fff}
#lo-card dl{margin-top:var(--wp-space-sm);display:grid;grid-template-columns:auto 1fr;
  gap:6px var(--wp-space-sm);font-size:15px}
#lo-card dt{color:var(--wp-text-muted);font-size:var(--wp-fs-label);letter-spacing:.4px;
  align-self:center}
#lo-card dd{font-weight:var(--wp-fw-bold);word-break:break-word}
#lo-card .trong{margin-top:var(--wp-space-sm);font-size:13px;line-height:1.55;
  color:var(--wp-text-muted)}
#lo-card .xem{width:100%;margin-top:var(--wp-space-md);height:var(--wp-control-h-lg);
  font-size:var(--wp-fs-label);font-weight:var(--wp-fw-bold);letter-spacing:1px;
  text-transform:uppercase;--r:16px}
/* 25/09 Anh Tony: nut trong the can nen trung mau the => khong nhan ra la nut. Dung --wp-vang nhu #nut-lop */
#lo-card .xem{--nen:var(--wp-vang);color:var(--wp-canh-teal);box-shadow:0 3px 10px rgba(0,0,0,.35)}
#lo-card .xem:hover{--nen:#FFFFFF;color:var(--wp-canh-teal)}
#lo-card .nguon{margin-top:var(--wp-space-sm);font-size:11px;line-height:1.5;
  color:var(--wp-text-muted)}
#lo-card .ngay{margin-top:var(--wp-space-xs);font-size:12px;color:var(--wp-text-soft)}
/* 24/09 - nhan "ERA doc quyen" duoi ma can */
#lo-card .era{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:0 8px 0 8px;
  background:var(--wp-vang);color:#00232C;font-size:11px;font-weight:var(--wp-fw-bold);
  letter-spacing:.8px;text-transform:uppercase}
#lo-card .ma{font-size:26px}

@media (max-height:600px){
  #lo-card{top:calc(var(--wp-space-xs) + var(--wp-nav-h));max-height:calc(100vh - 150px);
    width:250px;padding:var(--wp-space-sm)}
  #lo-card .ma{font-size:24px}
  #lo-card .xem{height:40px}
  /* Man ngang thap: thanh buoc tut xuong bottom 12px, nut lop phai tut theo
     de khong de len no. */
  #nut-lop{height:40px;padding:0 var(--wp-space-md);bottom:var(--wp-space-sm)}
}
@media (max-width:568px){
  #lo-card{width:calc(100vw - var(--wp-space-xl))}
  #nut-lop{padding:0 var(--wp-space-sm);letter-spacing:.6px}
}

/* ============================================================
   BO LOC  "san pham + dien tich + gia"   (24/09/2026 toi)
   Anh Tony: "Tu ma can, em bo sung loai hinh san pham. Tu day minh tao ra
   bo loc gom: san pham + dien tich + gia."  => DAY LA VIEC ANH GIAO.

   🔴 VI TRI - da do het 4 goc (xem chu thich `#nut-lop`), chi con COT PHAI
      GIUA: duoi la ban (96px + dong chu ~40px), tren qua cau + thanh zoom.
      Panel lui vao `right:60px` de KHONG DE thanh zoom (rong 34, mep 16).
      Day `max-height` tinh tu 176px = 32 + nav 52 + 12 + cau 64 + 16:
      iPad gen 9 ngang 1080x810 => cao toi da 482px.
   🔴 Man <= 760px HOAC thap <= 600px (dien thoai ngang): NGAN KEO DUOI,
      mac dinh THU GON thanh nut "Lọc căn".
   Chu to: sale doc chip ra mieng voi khach (luat "widget cho sale phai to").
   ============================================================ */
#loc-nut{position:fixed;right:var(--wp-space-md);top:152px;
  z-index:calc(var(--wp-z-overlay) + 1);height:var(--wp-control-h-lg);
  padding:0 var(--wp-space-md);font-size:15px;font-weight:var(--wp-fw-bold);
  letter-spacing:.6px;white-space:nowrap;--r:16px}
#loc-nut[hidden],#loc[hidden]{display:none}
#loc-nut .so{display:inline-block;margin-left:6px;min-width:22px;padding:1px 6px;
  border-radius:0 7px 0 7px;background:var(--wp-vang);color:#00232C;font-size:13px}
/* rong 380: "Tất cả (48)" + "Garden Grand Villa (30)" vua mot hang
   (340 thi moi chip mot hang, gia bi day xuong duoi mep tren iPad) */
#loc{position:fixed;right:60px;top:152px;width:380px;
  max-width:calc(100vw - 80px);max-height:calc(100vh - 152px - 176px);overflow-y:auto;
  z-index:calc(var(--wp-z-overlay) + 1);
  background:var(--wp-overlay-nav);backdrop-filter:blur(6px);
  border-radius:0 18px 0 18px;box-shadow:3px 3px 18px rgba(0,0,0,.34);
  padding:var(--wp-space-sm) var(--wp-space-md) var(--wp-space-md)}
#loc .dau{display:flex;align-items:center;gap:var(--wp-space-xs)}
#loc .dau b{font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--wp-primary-tint)}
#loc .dau button{margin-left:auto;background:transparent;color:var(--wp-text-soft);
  font-size:14px;font-weight:var(--wp-fw-bold);padding:6px 4px}
#loc .dau button:hover{color:var(--wp-text)}
#loc .kq{margin-top:4px;font-size:16px;color:var(--wp-text-soft)}
#loc .kq strong{font-size:22px;color:var(--wp-text)}
#loc h4{margin-top:var(--wp-space-md);font-size:12px;letter-spacing:1px;text-transform:uppercase;
  color:var(--wp-text-muted);font-weight:var(--wp-fw-bold)}
#loc .chips{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
#loc .c{--r:12px;--nen:rgba(0,35,44,.75);min-height:40px;padding:6px 12px;
  font-size:15px;font-weight:var(--wp-fw-bold);text-align:left;line-height:1.2;
  border:1px solid var(--wp-hairline);box-shadow:none}
#loc .c:hover{--nen:var(--wp-primary-hover)}
#loc .c.on{--nen:var(--wp-primary-tint);color:#00232C;border-color:var(--wp-primary-tint)}
#loc .c i{font-style:normal;font-weight:var(--wp-fw-regular);opacity:.85;margin-left:4px}
#loc .c.rong{opacity:.45}
#loc .dt{margin-top:6px;font-size:20px;font-weight:var(--wp-fw-bold)}
#loc .dt small{font-size:14px;font-weight:var(--wp-fw-regular);color:var(--wp-text-soft)}
#loc .rl{display:flex;align-items:center;gap:var(--wp-space-xs);margin-top:4px;
  font-size:14px;color:var(--wp-text-soft)}
#loc .rl span{width:34px}

     giohang/?pk=aqua&can=AQU-D15.10             -> + mo san the can do, xoay toi can
     giohang/?pk=park-village&can=A01&lop=thuc-te -> + lop anh thuc te
   `pk`  : aqua · park-village · nagomi · nagomi-2 (xem LINK_PK, nhan ca ten goi khac)
   `can` : ma SAN PHAM (AQU-D15.10) HOAC ma tren ban ve (D15-10) - khong phan biet hoa thuong
   `lop` : thuc-te (mac dinh ban ve). Phan khu khong co anh that (Nagomi) thi bo qua.
   Nguoi xem bam chip / chon can / doi lop -> thanh dia chi TU DOI THEO (`ghiLink`)
   => sale chep link tren trinh duyet la gui duoc dung the dang xem.
   🔴 Canh mo dau nap qua bien krpano `startscene` (action startup trong tour.xml),
      KHONG loadscene tu JS luc onready: luc do xml chua doc xong, action startup
      chay sau se de ve scene[0].
   ============================================================ */
var LINK_PK = {
  'pk_aqua': ['aqua', 'the-aqua', 'pk-the-aqua', 'pk-aqua', 'theaqua'],
  'pk_park_village': ['park-village', 'parkvillage', 'pk-park-village', 'pv', 'park-villa', 'park'],
  'pk_nagomi': ['nagomi', 'rivera-nagomi', 'pk-rivera-nagomi', 'rivera'],
  'pk_nagomi_pv': ['nagomi-2', 'nagomi2', 'rivera-nagomi-2', 'pk-rivera-nagomi-2'],
  'pk_aqua_trong': ['aqua-trong', 'aqua-tu-trong', 'the-aqua-trong'],   /* 01/10 toi */
  'pk_aqua_trai': ['aqua-1', 'the-aqua-1', 'aqua1', 'aqua-trai', 'aqua-cum-trai', 'the-aqua-trai'],   /* 01/10 canh con - doi ten The Aqua 1 (link cu van vao) */
  'pk_aqua_phai': ['aqua-2', 'the-aqua-2', 'aqua2', 'aqua-phai', 'aqua-cum-phai', 'the-aqua-phai']
};
function slugPK(id) { return (LINK_PK[id] || [id])[0]; }
function khongDauLink(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\u0111/g, 'd').replace(/[\s_]+/g, '-').trim();
}
var LINK = (function () {
  var q = new URLSearchParams(location.search);
  var pk = khongDauLink(q.get('pk')), id = null;
  for (var k in LINK_PK) {
    if (pk && (k === pk.replace(/-/g, '_') || LINK_PK[k].indexOf(pk) >= 0) && timCanh(k)) id = k;
  }
  var lop = khongDauLink(q.get('lop'));
  return {
    id: id,
    that: lop === 'thuc-te' || lop === 'that' || lop === 'anh-that',
    can: (q.get('can') || '').trim()
  };
})();
if (LINK.id) {
  canhDang = LINK.id;
  lopDang = (LINK.that && coAnhThat(timCanh(LINK.id))) || !timCanh(LINK.id).canhVe ? 'that' : 've';
}

/* Ghi trang thai dang xem len thanh dia chi (khong nap lai trang). Giu nguyen
   tham so khac (vd `nc`, `vien`). */
function ghiLink() {
  if (!window.history || !history.replaceState || !window.URLSearchParams) return;
  var q = new URLSearchParams(location.search);
  q.set('pk', slugPK(canhDang));
  var c = timCanh(canhDang);
  if (loDang && c) q.set('can', c.maSP ? c.maSP(loDang) : loDang); else q.delete('can');
  if (lopDang === 'that' && coAnhThat(c)) q.set('lop', 'thuc-te'); else q.delete('lop');
  q.delete('startscene');
  history.replaceState(null, '', location.pathname + '?' + q.toString() + location.hash);
}

/* `&can=`: cho bang hang + lo cua phan khu nap xong, tim can, bam ho, xoay toi can. */
function moCanTuLink(lan) {
  if (!LINK.can || !kp) return;

  var c = timCanh(canhDang);
  if (!(BH_XONG && LO && LO_KHU[canhDang] === LO)) {
    if (lan < 80) setTimeout(function () { moCanTuLink(lan); }, 250);   /* toi da ~20 s */
    return;
  }
  var tim = LINK.can.toUpperCase(), ma = null;
  for (var m in LO.lo) {
    if (m.toUpperCase() === tim || (c && c.maSP && String(c.maSP(m)).toUpperCase() === tim)) { ma = m; break; }
  }
  LINK.can = '';                                   /* chi mo MOT lan */
  if (!ma) { console.warn('[link] khong thay can', tim, 'trong', canhDang); ghiLink(); return; }
  var o = LO.lo[ma], t = o && o.tam;
  if (t) {                                         /* xoay toi can, zoom vua du thay xung quanh */
    nguoiDaKeo = true;                             /* chan veGocChuan keo ve goc chuan */

    kp.call('lookto(' + t[0] + ',' + t[1] + ',' + Math.min(40, c.goc.fov) + ',smooth(),true,true)');
  }
  eraChonLo(ma);
  ghiLink();
}

function timCanh(id) {
  for (var i = 0; i < CANH.length; i++) if (CANH[i].id === id) return CANH[i];
  return null;
}

/* Ten scene krpano that su, theo phan khu + lop dang xem */
function tenScene(id, lop) {
  var c = timCanh(id || canhDang);
  if (!c) return id;
  return (lop || lopDang) === 've' && c.canhVe ? c.canhVe : c.id;
}

/* 25/09: phan khu nay co cho xem lop anh that khong. Can CO ban ve (de doi
   qua lai) va KHONG gan co `khongAnhThat` (Nagomi: lo dat trong). */
function coAnhThat(c) {
  return !!(c && c.canhVe && !c.khongAnhThat);
}

/* Nguoc lai: ten scene krpano -> [phan khu, lop]. Dung khi mo trang bang
   `?startscene=` hoac khi hoi lai krpano dang o dau. */
function tachScene(ten) {
  for (var i = 0; i < CANH.length; i++) {
    if (CANH[i].id === ten) return [CANH[i].id, 'that'];
    if (CANH[i].canhVe === ten) return [CANH[i].id, 've'];
  }
  return null;
}

/* 🆕 01/10 Anh Tony (anh iPhone doc): "kiem tra do zoom di, no la zoom nguoc".
   Goc chuan khoa BE NGANG (HFOV, do theo iPad ngang). Man DOC cao gap ~1,8 lan be ngang
   => be DOC bi keo toi ~154 do (Aqua HFOV 135) - anh gian kieu mat ca, khu dat ti hon.
   Man doc ma vfov tinh ra > FOV_DOC_TOI_DA thi KHOA BE DOC o muc do (VFOV). Canh khong bi keo
   qua (Nagomi 88,2 -> ~120) giu nguyen. Man ngang (iPad/may tinh) KHONG doi gi.
   fovmax dat bang fov (sale chi zoom vao - luat cu). */
var FOV_DOC_TOI_DA = 130;
function gocTheoMan(c) {
  var g = c.goc, W = window.innerWidth, H = window.innerHeight;
  if (g.fovtype === 'HFOV' && H > W) {
    var v = 2 * Math.atan(Math.tan(g.fov * Math.PI / 360) * H / W) * 180 / Math.PI;
    if (v > FOV_DOC_TOI_DA) return { t: 'VFOV', fov: FOV_DOC_TOI_DA };
  }
  return { t: g.fovtype, fov: g.fov };
}

function veGocChuan() {
  if (!kp || nguoiDaKeo) return;
  var c = timCanh(canhDang); if (!c) return;
  var f = gocTheoMan(c);
  kp.set('view.fovtype', f.t);
  kp.set('view.fovmax', f.fov);
  kp.set('view.hlookat', c.goc.h);
  kp.set('view.vlookat', c.goc.v);
  kp.set('view.fov', f.fov);
}
/* Canh moi vao: <view> cua tour.xml doi khi ap TRE hon su kien 1 nhip (do 01/10: 2/6 lan dau con HFOV 154)
   => dat lai them 2 lan. Nguoi xem da cham keo thi `veGocChuan` tu thoi, khong giat. */
function gocSauCanh() { veGocChuan(); giuGoc(4000); }
/* NGUOI CANH GOC: su kien krpano o lan nap dau KHONG dang tin (do 01/10: 3/10 lan van HFOV 154 du da
   moc onxmlcomplete + onnewscene + dat lai tre 150/500ms). Nen trong `ms` dau sau moi lan vao canh,
   moi 200ms so goc dang co voi goc chuan theo man - lech thi dat lai. Khach cham / keo / lan chuot
   la DUNG NGAY (khong gianh quyen voi khach; lan chuot khong qua pointerdown nen phai bat rieng). */
var _giuGocT = null;
function giuGoc(ms) {
  var het = Date.now() + ms;
  clearInterval(_giuGocT);
  _giuGocT = setInterval(function () {
    if (Date.now() > het || nguoiDaKeo) { clearInterval(_giuGocT); return; }
    var c = kp && timCanh(canhDang); if (!c) return;
    var f = gocTheoMan(c);
    if (kp.get('view.fovtype') !== f.t || Math.abs(parseFloat(kp.get('view.fov')) - f.fov) > 0.5) veGocChuan();
  }, 200);
}
['wheel', 'touchstart', 'pointerdown', 'keydown'].forEach(function (e) {
  window.addEventListener(e, function () { clearInterval(_giuGocT); }, { passive: true, capture: true });
});
window.gocSauCanh = gocSauCanh;
/* xoay may doc <-> ngang: chua ai keo thi ve lai goc chuan theo khung moi */
window.addEventListener('resize', function () {
  clearTimeout(window._hgGocT);
  window._hgGocT = setTimeout(function () { if (!nguoiDaKeo) veGocChuan(); }, 250);
});

function tenVien() {
  var c = timCanh(canhDang); if (!c) return '';
  if (c.cha) { var ch = timCanh(c.cha); return (ch ? ch.ten : '') + ' · ' + (c.tenCon || ''); }
  var coCon = CANH.some(function (x) { return x.cha === c.id; });
  return c.ten + (coCon && c.tenCon ? ' · ' + c.tenCon : '');
}

function moNgan(mo) {
  var N = document.getElementById('ngan'), B = document.getElementById('ngan-nen'), V = document.getElementById('ngan-nut');
  if (!N) return;
  if (mo) dungNgan();
  N.classList.toggle('mo', mo); B.classList.toggle('mo', mo);
  N.style.transform = '';
  V.setAttribute('aria-expanded', mo ? 'true' : 'false');
}
window.eraMoNgan = moNgan;

function nutNgan(cls, html, on, bam) {
  var e = document.createElement('button');
  e.type = 'button'; e.className = (cls === 'tay' ? 'tay' : 'k3d ' + cls) + (on ? ' on' : '');
  e.innerHTML = html; e.onclick = bam; return e;
}

function dungNgan() {
  var N = document.getElementById('ngan'); if (!N) return;
  var dang = timCanh(canhDang), goc = dang ? (dang.cha || dang.id) : null;
  N.innerHTML = '';
  N.appendChild(nutNgan('tay', '', false, function () { moNgan(false); }));
  N.lastChild.setAttribute('aria-label', 'Đóng');
  var h = document.createElement('h4'); h.textContent = 'Phân khu'; N.appendChild(h);
  CANH.forEach(function (c) {
    if (c.cha) return;
    var on = c.id === goc;
    N.appendChild(nutNgan('pk', '<span></span>' + (on ? '<span class="dau-tich">✓</span>' : ''), on,
      function () { moNgan(false); doiCanh(c.id); }));
    N.lastChild.firstChild.textContent = c.ten;
    var con = CANH.filter(function (x) { return x.cha === c.id; });
    if (!con.length) return;
    var hang = document.createElement('div'); hang.className = 'con';
    [c].concat(con).forEach(function (x) {
      var b = nutNgan('', '', x.id === canhDang, function () { moNgan(false); doiCanh(x.id); });
      b.textContent = x.tenCon || x.ten; hang.appendChild(b);
    });
    N.appendChild(hang);
  });
  var tabs = document.querySelectorAll('#nav .tab');
  if (tabs.length) {
    h = document.createElement('h4'); h.textContent = 'Trang'; N.appendChild(h);
    var luoi = document.createElement('div'); luoi.className = 'trang';
    Array.prototype.forEach.call(tabs, function (t) {
      luoi.appendChild(nutNgan('', t.innerHTML, t.classList.contains('on'), function () { moNgan(false); t.click(); }));
    });
    N.appendChild(luoi);
  }
}

function ganNgan() {
  if (nganDaGan) return; nganDaGan = true;
  var N = document.getElementById('ngan'), V = document.getElementById('ngan-nut'), B = document.getElementById('ngan-nen');
  if (!N || !V) return;
  V.onclick = function () { moNgan(!N.classList.contains('mo')); };
  B.onclick = function () { moNgan(false); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') moNgan(false); });
  /* vuot xuong de dong (chi khi ngan dang o dinh, khong cuop thao tac cuon) */
  var y0 = null, dy = 0;
  N.addEventListener('touchstart', function (e) { y0 = N.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  N.addEventListener('touchmove', function (e) {
    if (y0 === null) return; dy = e.touches[0].clientY - y0;
    if (dy > 0) { N.style.transition = 'none'; N.style.transform = 'translateY(' + dy + 'px)'; }
  }, { passive: true });
  N.addEventListener('touchend', function () {
    if (y0 === null) return; N.style.transition = '';
    if (dy > 70) moNgan(false); else N.style.transform = '';
    y0 = null;
  });
  var mq = window.matchMedia ? matchMedia(NGAN_MQ) : null;
  var theoMan = function () { document.body.classList.toggle('co-ngan', nganLaDT()); if (!nganLaDT()) moNgan(false); oViewTheoMan(); };
  if (mq) { if (mq.addEventListener) mq.addEventListener('change', theoMan); else mq.addListener(theoMan); }
  theoMan();
}

/* 01/10 (5) Anh Tony: "tren mobi to qua" - o view noi tren anh (krpano `kieu_o_view`, co iPad 17px)
   thu con 70% tren dien thoai; nut "Toan canh PK The Aqua" (layer o_tc_*) AN vi ngan keo da co
   muc Toan canh - nut do nam mep tren, de len logo + la ban o man hep. Goi moi lan doi canh
   (events era_ov.onxmlcomplete) + khi xoay may. */
function oViewTheoMan() {
  if (!kp) return;
  var dt = document.body.classList.contains('co-ngan'), i, n;
  n = +kp.get('hotspot.count') || 0;
  for (i = 0; i < n; i++)

      var H = 'hotspot[' + i + ']', c = timCanh(canhDang), a0 = kp.get(H + '.ath0');
      if (a0 == null) { a0 = +kp.get(H + '.ath'); kp.set(H + '.ath0', a0); }
      kp.set(H + '.scale', dt ? 0.7 : 1);
      /* man doc dien thoai hep (~100 do ngang) => o nam mep bi lem: keo vao 25% ve phia giua khung chuan */
      kp.set(H + '.ath', dt && c ? c.goc.h + (a0 - c.goc.h) * 0.75 : a0);
    }
  n = +kp.get('layer.count') || 0;
  for (i = 0; i < n; i++)
    if (String(kp.get('layer[' + i + '].name')).indexOf('o_tc_') === 0) kp.set('layer[' + i + '].visible', !dt);
}
window.oViewTheoMan = oViewTheoMan;

function veNgan() {

/* ============================================================
   96 KHUNG LO - bat / tat / to mau
   Hotspot nam o `lo-park-village.xml`, co `keep="true"` nen no SONG QUA
   MOI LAN DOI CANH - ke ca khi sang PK The Aqua.
   🔴 Vi vay ham nay la BAT BUOC: quen goi la 96 khung noi lo lung tren
      anh Aqua. Da co muc kiem rieng cho viec nay.
   ============================================================ */
/* 🐞 DA DINH 17/09 - dung viet lai thanh `if (!LO) return`:
   sang PK The Aqua thi `LO` ve null, ham thoat ngay va 96 khung VAN HIEN
   tren anh Aqua. Bai kiem muc [14] bat duoc. Nen phai nho DANH SACH MA LO
   rieng, song doc lap voi `LO`. */
/* 🔴 24/09: nay CO HAI phan khu co khung lo (PV + Aqua), ca hai `keep="true"`.
   Nen nho lo THEO TUNG PHAN KHU va moi lan goi thi: phan khu dang xem -> HIEN,
   moi phan khu khac -> TAT. Tham so `hien` cu giu lai cho khoi sua cho goi,
   nhung KHONG con dung - bat/tat tinh theo `canhDang`. */
var LO_KHU = {};           /* id phan khu -> du lieu lo da nap */

/* Ten hotspot krpano cua mot lo. `D4-01` co gach ngang - krpano doc gach
   ngang trong ten thanh PHEP TRU (bay 16/09) => doi het ky tu la thanh `_`. */
/* 🆕 24/09 (Nagomi): lo co truong `hs` thi dung ten do. Nagomi co `D14-10` TRUNG
   Y CHU can Aqua `D14-10` - cung ten `lo_D14_10` thi hotspot `keep` cua phan khu
   nap sau DE LEN phan khu kia, khong loi. Nagomi ghi san `lo_ng_<ma>`.
   `L` = du lieu phan khu (mac dinh `LO` dang xem). */
function tenHS(ma, L) {
  var o = (L || LO) && (L || LO).lo[ma];
  if (o && o.hs) return o.hs;
  return 'lo_' + String(ma).replace(/[^A-Za-z0-9]/g, '_');
}

/* ============================================================
   HAI BO KHUNG - BAN VE vs ANH THAT  (24/09, phuong an A)

   Anh Tony gui anh 24/09: tren lop ANH THAT khung "hoi lech so voi thuc te".
   Khung lay tu ban ve = CHAN NHA, anh chup thay MAI NHA (thi sai) + ban ve
   CDT la tranh minh hoa. => `lo-goc-*.json` co them `diem_that` (khop tung
   can vao mai nha, `01-CONG-CU/can-matbang-flycam/khop-mai-tung-can.py`).

   🔴🔴 BAY 24/09: doi `hotspot[..].point[i].ath/atv` LUC CHAY la VO ICH -
      krpano 1.19 NHAN so (`get` tra dung so moi) nhung KHONG VE LAI da giac,
      anh chup truoc/sau giong het TUNG PIXEL. Con so noi doi (ho T10).
   ✅ Nen lam HAI BO HOTSPOT: `lo_<ma>` (lo-aqua.xml, theo `diem`) cho lop ban
      ve, `lo_t_<ma>` (lo-aqua-that.xml, theo `diem_that`) cho lop anh that.
      Ca hai cung `ma` => onclick/onover goi cung ham, cung the thong tin.
      Moi thu ve/bat/tat di qua `cacHS()` (tat ca ten cua mot lo) va `hsDang()`
      (ten dang hien) - dung ghep 'hotspot[' + tenHS(ma) truc tiep nua.
   Lo nao khong co `diem_that` (vd PV hien tai) -> chi co mot bo, dung o ca
   hai lop. Co `diem_that` ma krpano chua co hotspot `lo_t_` (xml cu/chua
   doc xong) -> tam dung bo ban ve, `eraDongBoLo` chay lai khi xml xong.
   ============================================================ */
function tenHSThat(ma) { return 'lo_t_' + String(ma).replace(/[^A-Za-z0-9]/g, '_'); }

function coBoThat(o, ma) {
  return !!(o && o.diem_that && kp && kp.get('hotspot[' + tenHSThat(ma) + '].style'));
}

/* Moi ten hotspot cua mot lo (1 hoac 2) - de to mau / bat-tat ca hai bo cung luc */
function cacHS(ma, L) {
  var o = (L || LO) && (L || LO).lo[ma];
  return (o && o.diem_that) ? [tenHS(ma, L), tenHSThat(ma)] : [tenHS(ma, L)];
}

/* Ten hotspot DANG HIEN cua lo, theo lop dang xem */
function hsDang(ma, L) {
  var o = (L || LO) && (L || LO).lo[ma];
  return (lopDang === 'that' && coBoThat(o, ma)) ? tenHSThat(ma) : tenHS(ma, L);
}

function eraHienLo() {
  if (!kp) return;
  Object.keys(LO_KHU).forEach(function (id) {
    var L = LO_KHU[id];
    var hien = (id === canhDang);
    Object.keys(L.lo).forEach(function (ma) {
      var dang = hsDang(ma, L);
      cacHS(ma, L).forEach(function (h) {
        kp.set('hotspot[' + h + '].visible', hien && h === dang);
        datBong(h);          /* 25/09: bong mo an/hien cung khung */
      });
    });
  });
}

/* Bat/tat + to mau khung lo cua phan khu dang xem - AN TOAN VOI THU TU TAI.
   🔴 Neu hotspot cua phan khu nay CHUA CO (krpano chua doc xong `lo-*.xml`)
      thi CHO roi thu lai - dat `visible` len hotspot chua ton tai la ghi vao
      khong khi, xml toi sau se de `visible="false"` len (da dinh 24/09).
   Goi tu: `vaoCanh`, su kien `onxmlcomplete` cua krpano, va 2 nhip hen gio. */
function eraDongBoLo(lan) {
  if (!kp) return;
  oViewTheoMan();   /* 01/10 (5): mo thang `?pk=` thi canh dau nap TRUOC khi gan events[era_ov] */
  var L = LO_KHU[canhDang];
  var ma = L ? Object.keys(L.lo)[0] : null;
  var thieuVe = ma && !kp.get('hotspot[' + tenHS(ma, L) + '].style');
  /* bo anh that (`lo_t_`) cung phai cho - nhung het 40 nhip ma van thieu
     (vd lo-aqua-that.xml 404) thi CU CHAY: `hsDang()` tu lui ve bo ban ve. */
  var thieuThat = ma && L.lo[ma].diem_that && !coBoThat(L.lo[ma], ma);
  if (thieuVe || thieuThat) {
    lan = (lan || 0) + 1;
    if (lan <= 40) { setTimeout(function () { eraDongBoLo(lan); }, 250); return; }
    if (thieuVe) return;
  }
  eraHienLo();
  veLo();
}
window.eraDongBoLo = eraDongBoLo;

/* 🔎 28/09 (chat-aqua-net) - O ANH NET DE LEN LOP BAN VE (hien co Aqua: `aqua_net_*`).
   Hotspot trong tour.xml chi khai `urlnet`, KHONG khai `url`: krpano 1.19 tai anh
   ca khi hotspot dang an (do bang Playwright 28/09: an 8 o van tai du 8). Ham nay
   gan `url = urlnet` SAU khi anh 360 tai xong (su kien `onloadcomplete`, + 1 nhip
   hen gio du phong) => ~3 MB anh net khong tranh bang thong voi luot mo trang.
   Doi lop / doi canh: krpano dung lai hotspot tu XML (url trong) -> ham chay lai,
   anh da nam trong bo nho dem trinh duyet nen hien ngay. */
function eraAnhNet() {
  if (!kp) return;
  var n = kp.get('hotspot.count') || 0;
  for (var i = 0; i < n; i++) {
    var h = 'hotspot[' + i + '].';
    var u = kp.get(h + 'urlnet');
    if (u && !kp.get(h + 'url')) kp.set(h + 'url', u);
  }
}
window.eraAnhNet = eraAnhNet;
/* `onloadcomplete` bao xong theo goc XML (h5 v45), nhung ngay sau do `veGocChuan` xoay
   xuong nadir (BAY 50) va tai tiep tile moi. Lui CO DINH khong du: do 28/09 local 2 s la
   vua, len Vercel that thi anh net van chen giua tile (9,4 s vs tile cuoi 11,3 s).
   => DO THAT: doi toi khi trinh duyet NGUNG tai tile anh 360 (`.tiles/`) du 1,5 s
      (Resource Timing), toi da 20 s thi cu gan. */
window.eraAnhNetSau = function () {
  var bd = Date.now();
  (function cho() {
    var cuoi = 0;
    if (window.performance && performance.getEntriesByType) {
      performance.getEntriesByType('resource').forEach(function (r) {
        if (r.name.indexOf('.tiles/') > 0 && r.responseEnd > cuoi) cuoi = r.responseEnd;
      });
    }
    var yen = performance.now() - cuoi;
    if (yen >= 1500 || Date.now() - bd > 20000) eraAnhNet();
    else setTimeout(cho, 500);
  })();
};

/* ============================================================
   🆕 NHAN MA CAN NOI  (29/09, Anh Tony - chat-nhan-can)

   Anh Tony: "cham diem len de ve ma can noi ... tu moi huong deu co the thay".
   Ban ve Aqua dan vao anh bi XOAY ~179 do (`can.xoay_do` trong lo-goc-aqua.json)
   => moi ma in san tren ban ve lon nguoc / nam nghieng. Nhan nay la chu HTML dat
   len TAM tung can, luon dung thang, xoay tour huong nao cung doc duoc.

   · Chi phan khu co `nhanMa: true` trong CANH (hien: Aqua). Chi can ERA (co dong
     trong Sheet) + khop bo loc. Dang chon 1 can -> can do nen vang, can khac mo.
   · Lop BAN VE dat o `tam` (tam khung ban ve). Lop ANH THAT dat o tam cua
     `diem_that` (khung da khop mai nha) - cung mot can nhung hai cho khac nhau.
   · Toa do: `kp.spheretoscreen` x ti le khung/stage (giong trang Thuc te).
     Tinh lai MOI KHUNG HINH nhung bo qua khi goc nhin + trang thai khong doi.
   · 🔴 Tam `diem_that` lay TRUNG BINH VECTO 3D, khong trung binh ath - lo nam
     ngang ath 180/-180 thi trung binh so hoc ra phia doi dien.
   ============================================================ */
function vecTo(h, v) {
  h *= Math.PI / 180; v *= Math.PI / 180;
  return [Math.cos(v) * Math.sin(h), Math.sin(v), Math.cos(v) * Math.cos(h)];
}
function tamDiem(ds) {
  var x = 0, y = 0, z = 0;
  ds.forEach(function (p) { var q = vecTo(p[0], p[1]); x += q[0]; y += q[1]; z += q[2]; });
  var n = Math.sqrt(x * x + y * y + z * z) || 1;
  return [Math.atan2(x, z) * 180 / Math.PI, Math.asin(y / n) * 180 / Math.PI];
}
var NHAN = { L: null, e: {}, khoa: '' };
function dungNhan(L) {               /* tao lai the chu khi doi phan khu */
  var hop = document.getElementById('lop-ma');
  hop.innerHTML = ''; NHAN.e = {}; NHAN.L = L; NHAN.khoa = '';
  if (!L) return;
  Object.keys(L.lo).forEach(function (ma) {
    var o = L.lo[ma];
    if (!o.tam) return;
    var d = document.createElement('div');
    d.className = 'ma';                 /* <b> bang chu · <i> cot + cham o chan (CSS) */
    d.appendChild(document.createElement('b')).textContent = ma;
    d.appendChild(document.createElement('i'));
    hop.appendChild(d);
    NHAN.e[ma] = { d: d, ve: o.tam, that: (o.diem_that && o.diem_that.length) ? tamDiem(o.diem_that) : o.tam };
  });
}
function veNhan() {
  requestAnimationFrame(veNhan);
  var hop = document.getElementById('lop-ma');
  var c = timCanh(canhDang);
  var bat = !!(kp && c && c.nhanMa && LO && LO_KHU[canhDang] === LO && BH_XONG);
  if (!bat) { if (hop.style.display !== 'none') hop.style.display = 'none'; return; }
  if (NHAN.L !== LO) dungNhan(LO);
  var h = +kp.get('view.hlookat'), v = +kp.get('view.vlookat'), f = +kp.get('view.fov');
  var sw = +kp.get('stagewidth'), sh = +kp.get('stageheight');
  if (!(sw > 0) || !isFinite(h)) return;
  var khoa = [h.toFixed(3), v.toFixed(3), f.toFixed(3), sw, sh, lopDang, loDang,
              JSON.stringify(LOC), innerWidth, innerHeight].join('|');
  /* 🔴 Do that 29/09: vua doi goc thi `get('view.*')` da ra so MOI nhung
     `spheretoscreen` con tinh theo ma tran KHUNG TRUOC (krpano cap nhat luc ve).
     Bo qua ngay khi khoa trung => nhan ket o cho cu (lech ~385 px o goc toan canh).
     => sau moi lan doi, tinh them 8 khung nua roi moi nghi. */
  if (khoa === NHAN.khoa) { if (!(NHAN.them > 0)) return; NHAN.them--; }
  else { NHAN.khoa = khoa; NHAN.them = 8; }
  hop.style.display = '';
  /* Co chu TI LE NGHICH voi fov - hoc PGBL (`era_lots_scale` trong tour360/era-lots-flycam.xml,
     scale = 50/fov). 🔴 Ban dau 29/09 Em dat 0.8..1.3 theo % zoom => Anh Tony: "binh thuong
     thi to, zoom vao thi nho, nguoc" - vi anh phong gap 5 ma chu chi to them 1,6 lan.
     Nay chu to DUNG NHIP voi ban ve, nhu dan tren mat dat: fov 113 -> 0.60 · fov 60 -> 1.0
     · fov 37,5 tro xuong -> 1.6 (tran - 29/09 ha tu 2.0 khi doi sang kieu bang co cot,
     zoom sat chu to qua van che can ben canh). */
  var tl = 60 / (f || 60);
  tl = tl < 0.6 ? 0.6 : (tl > 1.6 ? 1.6 : tl);
  hop.style.setProperty('--tl', tl.toFixed(3));
  var r = document.getElementById('pano').getBoundingClientRect();
  var fx = r.width / sw, fy = r.height / sh, vv = vecTo(h, v);
  var coChon = !!(loDang && LO.lo[loDang]);
  var hien = [];
  Object.keys(NHAN.e).forEach(function (ma) {
    var n = NHAN.e[ma], d = n.d;
    var p = lopDang === 'that' ? n.that : n.ve;
    var q = vecTo(p[0], p[1]);
    if (!laEra(ma) || !hopLoc(ma) || vv[0] * q[0] + vv[1] * q[1] + vv[2] * q[2] < 0.09) {
      d.style.display = 'none'; return;
    }
    var s = kp.spheretoscreen(p[0], p[1]);
    var x = s.x * fx, y = s.y * fy;
    d.style.display = '';
    d.style.left = x.toFixed(1) + 'px';
    d.style.top = y.toFixed(1) + 'px';
    d.classList.toggle('chon', ma === loDang);
    d.classList.toggle('mo', coChon && ma !== loDang);
    /* kich thuoc GOC cua bang chu (chua scale) - do 1 lan, chu khong doi */
    if (!(n.w > 0)) { var b = d.firstChild; n.w = b.offsetWidth; n.h = b.offsetHeight; }
    if (n.w > 0) hien.push({ n: n, x: x, y: y, chon: ma === loDang });
  });
  xepTang(hien, tl);
}

/* ============================================================
   🆕 XEP TANG COT (29/09, Anh Tony: "do cao nua, cac can gan nhau no chen nhau")
   Moi bang thu lan luot tang 0,1,2... (cot cao them BUOC px moi tang) toi khi
   KHONG de len bang nao da dat. Het tang ma van de -> lay tang de it nhat.
   · Thu tu: can DANG CHON truoc (luon cot thap nhat), roi tu DUOI man len TREN -
     bang phia tren bi day len thi di vao cho trong phia tren, khong de nguoc xuong.
   · Moi so tinh o don vi GOC roi nhan `tl` (co theo zoom) => khoang tranh cung co theo.
   · Chi tranh BANG voi BANG. Cot mong 2 px de len nhau van doc duoc.
   ============================================================ */
var COT = { goc: 24, buoc: 26, tang: 5, dem: 3 };
function xepTang(hien, tl) {
  hien.sort(function (a, b) { return (b.chon - a.chon) || (b.y - a.y); });
  var da = [];
  hien.forEach(function (it) {
    var w = it.n.w * tl, h = it.n.h * tl, dem = COT.dem;
    var tot = 0, deIt = Infinity;
    for (var t = 0; t < COT.tang; t++) {
      var day = it.y - (COT.goc + t * COT.buoc) * tl;   /* canh duoi bang */
      var o = { l: it.x - w / 2 - dem, r: it.x + w / 2 + dem, tr: day - h - dem, d: day + dem };
      var de = 0;
      for (var i = 0; i < da.length; i++) {
        var k = da[i];
        var ox = Math.min(o.r, k.r) - Math.max(o.l, k.l), oy = Math.min(o.d, k.d) - Math.max(o.tr, k.tr);
        if (ox > 0 && oy > 0) de += ox * oy;
      }

/* ============================================================
   DOI LOP  ban ve <-> anh that

   🔴 PHAI CO `KEEPVIEW`: Anh Tony chot "khung lo dung yen dung cho".
      Khong co no thi krpano ap `<view>` cua canh moi (h=5 v=45 fov=105)

   🔴 VA PHAI DAT LAI GOC NHIN BANG TAY SAU DO: day dung la trang da dinh
      "doi ten canh ma khong doi anh" hoi 17/09 (xem khoi chu thich trong
      `doiCanh`). Khong dam chac `KEEPVIEW` khong dinh kieu tuong tu, nen

function doiLop(lop) {
  var c = timCanh(canhDang);
  if (!kp || !c || !c.canhVe || lop === lopDang) return;
  if (lop === 'that' && !coAnhThat(c)) return;   /* 25/09: Nagomi chi co ban ve */
  var g = {

  eraHienLo();          /* doi bo khung ban ve <-> anh that ngay, khong cho */
  veNutLop();
  veCard();
  var traLai = function () {
    if (!kp || !isFinite(g.h)) return;
    if (Math.abs(parseFloat(kp.get('view.hlookat')) - g.h) > 0.5 ||
        Math.abs(parseFloat(kp.get('view.vlookat')) - g.v) > 0.5 ||

      kp.set('view.vlookat', g.v);
      kp.set('view.fov', g.f);
    }
    eraHienLo();
  };
  setTimeout(traLai, 60);

}
window.doiLop = doiLop;

/* ============================================================
   🆕 BO LOC CAN ERA  —  san pham + dien tich + gia   (24/09/2026 toi)

   Anh Tony: "Tu ma can, em bo sung giup anh loai hinh san pham. Tu day
   minh tao ra bo loc gom: san pham + dien tich + gia."

   · Chi loc CAN ERA cua PHAN KHU DANG XEM. Ba nhom loc ghep kieu "VA".
   · So tren moi chip = so can SE SANG neu bam chip do, giu nguyen 2 nhom
     loc kia (dem kieu "mat cat") - sale nhin la biet con bao nhieu can.
   · Can khong khop: vien xanh nhat, khong to nen, KHONG bam duoc
     (`kieuLo` + `veLo`). Ca 2 bo khung Aqua (`lo_` va `lo_t_`) deu di qua
     `cacHS()/datKieu()` nen tu dung ca hai lop.
   · Loai hinh: cot "Loại hình" trong Sheet thang; o trong / "Chưa rõ" thi
     lay tu mau chu giai ban ve (`lo-goc-*.json`, khoa `loai`).
   · GIA: luat 2 chu so co nghia, doc bang `ERA_BH.giaTy` (xem wp-banghang.js,
     kiem bang `node _kiem-gia.test.js`). Chip khoang gia sinh tu du lieu
     bang `ERA_BH.chiaNhomGia` - mep roi dung ranh chu so thu 2 nen moi can
     nam gon trong DUNG MOT chip. + chip "Chưa có giá".
   ============================================================ */
var LOC = locMoi();
var NHOM_GIA = [];         /* chip gia cua phan khu dang xem */
var DT_BIEN = null;        /* [min, max] dien tich dat (lam tron ra ngoai) */
var locMo = null;          /* null = chua ai bam -> theo kho man */

function locMoi() { return { loai: {}, gia: {}, dtTu: null, dtDen: null }; }

function locLaNganKeo() {
  return !!(window.matchMedia && matchMedia('(max-width:760px), (max-height:600px)').matches);
}

/* Thong tin loc cua mot lo (ma ban ve) */
function ttLo(ma) {
  var c = timCanh(canhDang);
  var r = (window.ERA_BH && c && c.maSP) ? ERA_BH.lay(c.maSP(ma)) : null;
  var o = LO && LO.lo[ma];
  var loai = r && r.loaiHinh;
  if (!loai || (window.ERA_BH && ERA_BH.khongDau(loai) === 'chua ro')) {
    loai = (o && LO.loai && LO.loai[o.loai]) || (o && o.loai) || 'Chưa rõ';
  }
  return { loai: loai, dt: r ? r.dtDat : null, gia: r ? r.gia : null };
}

function khoaGia(g) {
  if (!g) return 'khong';
  for (var i = 0; i < NHOM_GIA.length; i++) {
    if (g.tu >= NHOM_GIA[i].tu - 1e-9 && g.den <= NHOM_GIA[i].den + 1e-9) return String(NHOM_GIA[i].tu);
  }
  return 'khong';
}

function dtDangLoc() {
  return !!(DT_BIEN && LOC.dtTu != null &&
            (LOC.dtTu > DT_BIEN[0] || LOC.dtDen < DT_BIEN[1]));
}

/* `bo` = nhom loc BO QUA (de dem so tren chip kieu mat cat) */
function hopLoc(ma, bo) {
  if (!LO || !LO.lo[ma]) return true;
  var t = ttLo(ma), k;
  if (bo !== 'loai') {
    for (k in LOC.loai) { if (!LOC.loai[t.loai]) return false; break; }
  }
  if (bo !== 'dt' && dtDangLoc()) {
    if (t.dt == null || t.dt < LOC.dtTu || t.dt > LOC.dtDen) return false;
  }
  if (bo !== 'gia') {
    for (k in LOC.gia) { if (!LOC.gia[khoaGia(t.gia)]) return false; break; }
  }
  return true;
}
window.eraHopLoc = hopLoc;

function dsEra() {
  if (!LO || !BH_XONG) return [];
  return Object.keys(LO.lo).filter(laEra);
}

function soDangLoc() {
  var n = Object.keys(LOC.loai).length + Object.keys(LOC.gia).length;
  return n + (dtDangLoc() ? 1 : 0);
}

/* Dung khung bo loc cho phan khu dang xem (goi khi doi phan khu / nap xong) */
function dungLoc() {
  var P = document.getElementById('loc'), N = document.getElementById('loc-nut');
  if (!P || !N) return;
  var ds = dsEra();
  if (!ds.length) { P.hidden = true; N.hidden = true; P.innerHTML = ''; return; }

  /* bien dien tich */
  var dts = ds.map(function (m) { return ttLo(m).dt; }).filter(function (x) { return x != null; });
  DT_BIEN = dts.length ? [Math.floor(Math.min.apply(null, dts)), Math.ceil(Math.max.apply(null, dts))] : null;
  /* 🔴 25/09 sua bay: doiCanh() goi dungLoc() khi `LO` VAN LA CUA PHAN KHU CU
     => DT_BIEN tam lay bien phan khu cu (Nagomi 682-860). Nap xong LO moi,
     bien Aqua 225-1302 bao trum 682-860 nen dieu kien cu KHONG dat lai
     => ve Aqua thay "13/48 + Xóa lọc" du khach chua loc gi. Nho bien cu
     trong `LOC._bien`, bien doi la dat lai ve tron khoang. */
  var khoaBien = DT_BIEN ? DT_BIEN.join('-') : '';
  if (DT_BIEN && (LOC.dtTu == null || LOC._bien !== khoaBien ||
                  LOC.dtTu < DT_BIEN[0] || LOC.dtDen > DT_BIEN[1])) {
    LOC.dtTu = DT_BIEN[0]; LOC.dtDen = DT_BIEN[1];
  }
  LOC._bien = khoaBien;
  /* chip gia */
  NHOM_GIA = ERA_BH.chiaNhomGia(ds.map(function (m) { return ttLo(m).gia; }));

  var h = [];
  h.push('<div class="dau"><b>Lọc căn ERA</b>' +
         '<button type="button" data-hd="dong">Thu gọn ✕</button></div>');
  h.push('<div class="kq" id="loc-kq"></div>');
  h.push('<h4>Loại sản phẩm</h4><div class="chips" id="loc-loai"></div>');
  if (DT_BIEN) {
    h.push('<h4>Diện tích đất</h4><div class="dt" id="loc-dt"></div>' +
           '<div class="rl"><span>Từ</span><input type="range" id="loc-dt-tu" step="1" aria-label="Diện tích từ"></div>' +
           '<div class="rl"><span>Đến</span><input type="range" id="loc-dt-den" step="1" aria-label="Diện tích đến"></div>');
  }
  /* 🔴 25/09 Anh Tony: "Bo het phan nay di... cac cau AI viet se hien len cho
     khach hang thay." => CHUA CO GIA THI GIAU HAN MUC GIA BAN (tieu de + chip).
     KHONG dat cau huong dan nao ra man hinh. Logic loc gia giu nguyen: Anh
     dien cot "Giá bán" trong Sheet (vd "25 tỷ", "2,4 tỷ") thi NHOM_GIA co
     phan tu, muc nay tu hien lai, chi co chip khoang gia. */
  if (NHOM_GIA.length) {
    h.push('<h4>Giá bán</h4><div class="chips" id="loc-gia"></div>');
  } else {
    LOC.gia = {};          /* khong con chip gia => khong duoc con loc gia treo */
  }
  P.innerHTML = h.join('');

  if (DT_BIEN) {
    var a = document.getElementById('loc-dt-tu'), b = document.getElementById('loc-dt-den');
    [a, b].forEach(function (x) { x.min = DT_BIEN[0]; x.max = DT_BIEN[1]; });
    a.value = LOC.dtTu; b.value = LOC.dtDen;
    a.oninput = function () { LOC.dtTu = Math.min(+a.value, +b.value); a.value = LOC.dtTu; apLoc(); };
    b.oninput = function () { LOC.dtDen = Math.max(+a.value, +b.value); b.value = LOC.dtDen; apLoc(); };
  }
  P.onclick = function (ev) {
    var el = ev.target.closest ? ev.target.closest('button') : null;
    if (!el) return;
    var hd = el.getAttribute('data-hd');
    if (hd === 'dong') { moLoc(false); return; }
    if (hd === 'xoa') { xoaLoc(); return; }
    var nhom = el.getAttribute('data-nhom'), gt = el.getAttribute('data-gt');
    if (!nhom) return;
    if (gt === '*') LOC[nhom] = {};
    else if (LOC[nhom][gt]) delete LOC[nhom][gt];
    else LOC[nhom][gt] = true;
    apLoc();
  };
  N.onclick = function () { moLoc(true); };

  if (locMo === null) locMo = false;   /* 01/10 Anh Tony: "cum loc can luon nho, khach click vao moi phong to" */
  moLoc(locMo, true);
  veDemLoc();
}

function moLoc(mo, khongGhi) {
  var P = document.getElementById('loc'), N = document.getElementById('loc-nut');
  if (!P || !N || !P.innerHTML) return;
  if (!khongGhi) locMo = mo;
  P.hidden = !mo;
  N.hidden = mo;
}
window.eraMoLoc = moLoc;

/* Chip + so dem + dong ket qua. KHONG dung lai thanh keo (dang keo ma
   dung lai innerHTML la mat tay keo). */
function veDemLoc() {
  var ds = dsEra();
  if (!ds.length) return;
  var ttAll = {}; ds.forEach(function (m) { ttAll[m] = ttLo(m); });
  var sang = ds.filter(function (m) { return hopLoc(m); }).length;
  var kq = document.getElementById('loc-kq');
  /* "Xoa loc" nam ngay dong ket qua (luon trong tam mat, khong bi cuon
     khuat duoi day panel tren iPad), chi hien khi dang loc. */
  if (kq) kq.innerHTML = '<span>Đang sáng <strong>' + sang + '</strong> / ' + ds.length + ' căn</span>' +
    (soDangLoc() ? '<button type="button" class="k3d xoa" data-hd="xoa">Xóa lọc</button>' : '');

  /* loai - thu tu: nhieu can truoc */
  var dem = {}, demMC = {};
  ds.forEach(function (m) {
    var l = ttAll[m].loai; dem[l] = (dem[l] || 0) + 1;
    if (hopLoc(m, 'loai')) demMC[l] = (demMC[l] || 0) + 1;
  });
  var loais = Object.keys(dem).sort(function (x, y) { return dem[y] - dem[x] || (x < y ? -1 : 1); });
  var tatLoai = ds.filter(function (m) { return hopLoc(m, 'loai'); }).length;
  var h = [chipLoc('loai', '*', 'Tất cả', tatLoai, !Object.keys(LOC.loai).length)];
  loais.forEach(function (l) { h.push(chipLoc('loai', l, l, demMC[l] || 0, !!LOC.loai[l])); });
  var e = document.getElementById('loc-loai'); if (e) e.innerHTML = h.join('');

  /* gia */
  var dg = {};
  ds.forEach(function (m) { if (hopLoc(m, 'gia')) { var k = khoaGia(ttAll[m].gia); dg[k] = (dg[k] || 0) + 1; } });
  var coKhong = ds.some(function (m) { return !ttAll[m].gia; });
  h = [];
  NHOM_GIA.forEach(function (g) {
    var k = String(g.tu);
    h.push(chipLoc('gia', k, g.nhan, dg[k] || 0, !!LOC.gia[k]));
  });
  /* 25/09: chip nhom "khong co gia" chi hien khi DA CO chip khoang gia
     (bang hang co can co gia, co can chua). Chu cho khach: "Giá liên hệ". */
  if (coKhong && NHOM_GIA.length) h.push(chipLoc('gia', 'khong', 'Giá liên hệ', dg.khong || 0, !!LOC.gia.khong));
  e = document.getElementById('loc-gia'); if (e) e.innerHTML = h.join('');

  /* dien tich */
  e = document.getElementById('loc-dt');
  if (e && DT_BIEN) {
    e.innerHTML = LOC.dtTu + ' – ' + LOC.dtDen + ' m² <small>(' +
      ds.filter(function (m) { return hopLoc(m, 'dt') && ttAll[m].dt != null &&
        ttAll[m].dt >= LOC.dtTu && ttAll[m].dt <= LOC.dtDen; }).length + ' căn)</small>';
  }

  var N = document.getElementById('loc-nut');
  if (N) {
    var n = soDangLoc();
    N.innerHTML = 'Lọc căn' + (n ? ' <span class="so">' + sang + '/' + ds.length + '</span>' : '');
  }
}

function chipLoc(nhom, gt, nhan, so, on) {
  return '<button type="button" class="k3d c' + (on ? ' on' : '') + (so ? '' : ' rong') +
         '" data-nhom="' + nhom + '" data-gt="' + thoat(gt) + '" aria-pressed="' + on + '">' +
         thoat(nhan) + '<i>(' + so + ')</i></button>';
}

function apLoc() {
  /* can dang chon bi loc ra ngoai thi bo chon (the thong tin dong lai) */
  if (loDang && !hopLoc(loDang)) loDang = null;
  reDang = null;
  veDemLoc();
  veLo();
  veCard();
}

function xoaLoc() {
  LOC = locMoi();
  if (DT_BIEN) {
    LOC.dtTu = DT_BIEN[0]; LOC.dtDen = DT_BIEN[1];
    var a = document.getElementById('loc-dt-tu'), b = document.getElementById('loc-dt-den');
    if (a) a.value = LOC.dtTu; if (b) b.value = LOC.dtDen;
  }
  apLoc();
}
window.eraXoaLoc = xoaLoc;

       🔴 Tu 17/09 mot phan khu co 2 ten scene (anh that / ban ve) nen phai
          tach ra bang `tachScene`, khong so thang voi `timCanh` nua. */
    var s = kp.get('xml.scene');
    var t = s ? tachScene(s) : null;
    /* 28/09: mo bang `?pk=` thi DA BIET canh - luc onready krpano co the con bao scene[0] */
    if (t && !LINK.id) { canhDang = t[0]; lopDang = t[1]; }
    /* 25/09: mo bang ?startscene=pk_nagomi (anh that) => dua ve ban ve,
       phan khu co `khongAnhThat` khong co duong nao vao anh that. */
    if (t && lopDang === 'that' && !coAnhThat(timCanh(canhDang))) {
      lopDang = 've';
      kp.call('loadscene(' + tenScene(canhDang, 've') + ', null, null, BLEND(0.5))');
    }
    /* Canh dau tien la `scene[0]` = pk_aqua (khong co ban ve). Neu phan khu
       dang mo CO ban ve ma krpano lai dang o anh that thi dua ve ban ve -
       Anh Tony chot khach nhin ban ve truoc. */
    veDS();
    baoThieuAnh();
    vaoCanh();
    napBangHang();
    /* 🔴 Listener KHONG con `{once:true}`: doi canh xong phai bat lai duoc
       lan keo tiep theo, khong thi tu canh thu hai tro di keo chuot la
       `veGocChuan` van giat khung hinh ve cho cu. */
    document.addEventListener('pointerdown', function () { nguoiDaKeo = true; });
    setTimeout(veGocChuan, 700);
    setTimeout(veGocChuan, 1600);
    giuGoc(9000);   /* 01/10: canh dau co the nap toi ~2-4s sau onready */
    /* chuan hoa link (`?pk=pv` -> `?pk=park-village`; ten sai -> ten phan khu dang hien that) */
    if (LINK.id || /[?&]pk=/.test(location.search)) ghiLink();
    moCanTuLink();
  }
});
</script>
